[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "muon-curvature"
version = "0.1.0"
description = "Directional-curvature calibration of Muon on tiny NanoGPT models"
requires-python = ">=3.10"
dependencies = ["torch>=2.2", "numpy>=1.24"]

[tool.setuptools.packages.find]
include = ["curvature_muon*", "third_party*"]
